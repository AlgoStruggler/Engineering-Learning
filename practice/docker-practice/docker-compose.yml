services:
    postgres:
        image: postgres:15
        container_name: dev-postgres
        environment:
            POSTGRES_USER: dev
            POSTGRES_PASSWORD: dev
            POSTGRES_DB: devdb
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7
        container_name: dev-redis
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data

volumes:
    pgdata:
    redisdata:

